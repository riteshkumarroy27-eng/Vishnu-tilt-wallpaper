
name: Build Vishnu Wallpaper APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q *.zip -d project
          ls -R project

      - name: Build APK
        run: |
          cd project/vishnu_tilt_live_wallpaper
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Vishnu-Wallpaper-APK
          path: project/vishnu_tilt_live_wallpaper/app/build/outputs/apk/debug/app-debug.apk
